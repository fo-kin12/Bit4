<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preventa 4BitMusic</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!--Orbitron -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head> 

<body>
  <section class="container my-5">
    <div class="preventa">
      <div class="row align-items-center">

        <!--texto y contador -->
        <div class="col-md-7">
          <p class="etiqueta">PROXIMO LANZAMIENTO</p>
          <h2 class="titulo">PREVENTA: Thriller-Michael Jackson - EDICIÓN NUMERADA</h2>
          <p class="descripcion">
            Solo 300 copias en vinilo translucido con certificado de autenticidad.
            Límite de 2 unidades por persona.
          </p>

          <div class="contador">
            <div class="caja-tiempo">
              <span class="numero" id="dias">00</span>
              <span class="unidad">DÍAS</span>
            </div>
            <div class="caja-tiempo">
              <span class="numero" id="horas">00</span>
              <span class="unidad">HORAS</span>
            </div>
            <div class="caja-tiempo">
              <span class="numero" id="minutos">00</span>
              <span class="unidad">MIN</span>
            </div>
            <div class="caja-tiempo">
              <span class="numero" id="segundos">00</span>
              <span class="unidad">SEG</span>
            </div>
          </div>    

          <button class="boton-reservar">RESERVAR</button>
        </div>

        <!-- lado derecho -->
        <div class="col-md-5 d-flex justify-content-center mt-4 mt-md-0">
          <div class="disco"></div>
        </div>

      </div>
    </div>
  </section>

  <script>
    // fecha del contador
    var fechaLanzamiento = new Date("2026-11-09T10:00:00");

    function actualizarContador() {
      var ahora = new Date();
      var diferencia = fechaLanzamiento - ahora; 

      //esto es por si la fecha ya paso q muestre cero 
      if (diferencia < 0) {
        diferencia = 0;
      }

      var dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
      var horas = Math.floor((diferencia / (1000 * 60 * 60)) % 24);
      var minutos = Math.floor((diferencia / (1000 * 60)) % 60);
      var segundos = Math.floor((diferencia / 1000) % 60);

      //agrega un 0 delante si el numero tiene una sola cifra 5 > 05
      document.getElementById("dias").textContent = String(dias).padStart(2, "0");
      document.getElementById("horas").textContent = String(horas).padStart(2, "0");
      document.getElementById("minutos").textContent = String(minutos).padStart(2, "0");
      document.getElementById("segundos").textContent = String(segundos).padStart(2, "0");
    }

    actualizarContador();                  // se ejecuta una vez al cargar
    setInterval(actualizarContador, 1000); // y luego cada 1 segundo 
  </script>

</body>
</html>
